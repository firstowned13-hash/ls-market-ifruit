<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LS Market</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">iFruit Marketplace</div>
        <h1>LS Market</h1>
      </div>
      <button id="sellBtn" class="primary small">+ Anunciar</button>
    </header>

    <section class="searchbar">
      <input id="searchInput" placeholder="Buscar anúncios" />
      <select id="categoryFilter">
        <option>Todos</option>
        <option>Veículos</option><option>Imóveis</option><option>Eletrônicos</option>
        <option>Roupas</option><option>Serviços</option><option>Outros</option>
      </select>
    </section>

    <div id="notice" class="notice hidden"></div>
    <main id="feed" class="feed"></main>

    <nav class="bottomnav">
      <button class="active" data-view="feed">Início</button>
      <button data-view="mine">Meus anúncios</button>
    </nav>
  </div>

  <dialog id="listingDialog" class="sheet">
    <form id="listingForm" method="dialog">
      <div class="sheet-head"><h2>Novo anúncio</h2><button type="button" class="ghost" data-close>Fechar</button></div>
      <label>Título<input name="title" maxlength="90" required placeholder="Ex.: Sultan RS bem conservado" /></label>
      <label>Descrição<textarea name="description" maxlength="1200" required rows="5" placeholder="Detalhes do item, condições, negociação..."></textarea></label>
      <div class="grid2">
        <label>Preço<input name="price" type="number" min="0" step="1" required /></label>
        <label>Categoria<select name="category" required><option>Veículos</option><option>Imóveis</option><option>Eletrônicos</option><option>Roupas</option><option>Serviços</option><option>Outros</option></select></label>
      </div>
      <label>Telefone para contato<input name="phone" maxlength="24" placeholder="Opcional" /></label>
      <div class="photos-row">
        <button id="pickPhotosBtn" type="button" class="secondary">Adicionar fotos</button>
        <span id="photoCount">0/10</span>
      </div>
      <div id="photoPreview" class="photo-preview"></div>
      <div class="paybox">
        <span>Taxa para publicar</span>
        <strong id="listingFeeLabel">$...</strong>
      </div>
      <button type="submit" class="primary full">Pagar e publicar</button>
      <p class="hint">O pagamento é confirmado pela folha nativa do iFruit Pay. O anúncio só entra no ar após a transação constar como succeeded.</p>
    </form>
  </dialog>

  <dialog id="detailDialog" class="sheet"><div id="detail"></div></dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
